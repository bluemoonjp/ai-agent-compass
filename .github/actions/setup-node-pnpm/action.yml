name: Setup Node and pnpm
description: Install pnpm, set up Node with pnpm's cache, and install this repository's dependencies with a frozen lockfile. Shared by ci.yml, fork-recheck.yml, and patrol.yml so the three don't drift out of sync with each other.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
