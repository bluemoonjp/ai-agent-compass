[extend]
useDefault = true

# Synthetic pattern used only to verify this workflow's gitleaks wiring in CI
# (see #14's acceptance test). It never matches a real secret.
[[rules]]
id = "compass-test-secret"
description = "Synthetic secret pattern used to verify gitleaks wiring in CI"
regex = '''COMPASS_TEST_SECRET_[A-Z0-9]{16}'''
